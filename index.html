<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08070f" />

    <title>Portfolio</title>
    <meta name="description" content="Personal developer portfolio." />

    <!-- Open Graph / social sharing. Title and description are refined at
         runtime from the private content (see src/main.tsx) so the real name
         stays out of the committed HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Portfolio" />
    <meta property="og:description" content="Personal developer portfolio." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portfolio" />
    <meta name="twitter:description" content="Personal developer portfolio." />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
